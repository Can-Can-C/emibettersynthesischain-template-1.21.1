pluginManagement {
    repositories {
        gradlePluginPortal()
        // ForgeGradle 发布在 Forge 自己的 maven 上（不在插件门户）
        maven {
            url = 'https://maven.minecraftforge.net/'
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'emibettersynthesischain'

// EMI 式模块化（common + platform）：common = 业务/渲染/Mixin/配置值；forge = 平台入口与资源。
include 'common'
include 'forge'