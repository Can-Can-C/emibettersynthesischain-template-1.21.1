# EMI Better Synthesis Chain - Forge 1.20.1 branch (hardcoded values, no template expansion).

modLoader="javafml" #mandatory
loaderVersion="[40,)" #mandatory

license="MIT"

[[mods]] #mandatory
modId="emibettersynthesischain" #mandatory
version="2.2.1" #mandatory
displayName="EMI Better Synthesis Chain" #mandatory
authors="Can-Can-C"
description='''
EMI Better Synthesis Chain - Forge 1.20.1 / EMI 1.1.24 addon: rewritten EMI recipe-tree view + hover-to-auto-craft.
'''

[[mixins]]
config="emibettersynthesischain.mixins.json"

# Forge loader
[[dependencies.emibettersynthesischain]]
modId="forge"
mandatory=true
versionRange="[40,)"
ordering="NONE"
side="BOTH"

# Minecraft
[[dependencies.emibettersynthesischain]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1]"
ordering="NONE"
side="BOTH"

# MixinExtras（ConfigScreenMixin @Local 运行时依赖；EMI 1.20.1 官方 jar 不携带）
# 说明：不要声明强制依赖——整合包常以 jarjar/内置形式提供其类（如 Redirector），
# 独立薄壳 jar 会被 FML JarSelector 跳过而"未注册"，强制依赖会误判缺失。
# 运行时只要类在 classpath（内置或放 mixinextras-forge 薄壳 jar）即可工作。
[[dependencies.emibettersynthesischain]]
modId="mixinextras"
mandatory=false
versionRange="[0.0.0,)"

# EMI (client dependency)
[[dependencies.emibettersynthesischain]]
modId="emi"
mandatory=true
versionRange="[1.1.0,)"
ordering="AFTER"
side="CLIENT"