# Forge 1.20.1 (ForgeGradle 6) —— 多版本分支（1.20.1-forge）
# Gradle 8.x wrapper（ForgeGradle 6 不兼容 Gradle 9），见 gradle/wrapper/gradle-wrapper.properties
# 注意：Gradle 8.7 最高支持 JVM 21 → 强制用 JDK17 跑 Gradle，IDEA 同步/构建才不会报
# "Java 25 与 Gradle 8.7 不兼容"（IDEA 建议的"升级 9.3.0"对该分支不可行：FG6 不支持 Gradle 9）
org.gradle.java.home=C:/Program Files/Java/jdk-17

org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft 与 Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1]
forge_version=1.20.1-47.4.5
loader_version_range=[40,)

# 映射：1.20.1 用官方（mojmap）channel；parchment 可选（parchmentmc 网络可达性未验证，先用 official）
mappings_channel=official
mappings_version=1.20.1

## Mod 属性（与主线一致）
mod_id=emibettersynthesischain
mod_name=EMI Better Synthesis Chain
mod_license=MIT
mod_version=2.2.1
mod_group_id=com.cancan.emibettersynthesischain