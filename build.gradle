// 根项目 = 聚合器（不打包代码）。
// 模块：common/（业务+渲染+Mixin+配置值）、forge/（平台入口与资源）。
// 构建用系统 gradle（Gradle 8.7 + JDK17，见 docs/05）：C:\gradle-tools\gradle-8.7\bin\gradle.bat -p 仓库根 build

subprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // javac 17 把 @Deprecated(forRemoval) 当"错误"诊断（ModLoadingContext.get() 等）：
        options.compilerArgs.add '-Xlint:-removal'
        options.compilerArgs.add '-Xlint:-deprecation'
        // mixin 目标都是 EMI（mod 类）→ 无 SRG 映射可查，关 refmap 生成避免 AP 报错
        options.compilerArgs.add '-Amixin.env.disableRefMap=true'
    }
}