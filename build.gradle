plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 官方客户端用 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

// Mixin：加 refmap、注册 config（骨架期 client 列表为空，移植阶段逐个加入）
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // 官方 EMI maven（repo.sleeping.town）本网络不可达 → EMI 用本地 jar（./libs）
    flatDir {
        dir 'libs'
    }
    // mixin annotation processor
    maven {
        url 'https://repo.spongepowered.org/maven'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // EMI（1.20.1 Forge 官方构建）：compileOnly 编进 classpath（含我们 Mixin 的内部类），
    // runtimeOnly 供 runClient 开发环境加载；不打进 mod 包、不发布。
    def emiJar = files("libs/emi-1.1.24+1.20.1+forge.1.jar")
    compileOnly emiJar
    runtimeOnly emiJar

    // Mixin 注解处理器
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
}

processResources {
    // 1.20.1 mods.toml 用硬编码值（见 src/main/resources/META-INF/mods.toml）：
    // ForgeGradle 的 expand 会把 TOML 当 Groovy 模板解析，中文/全角字符易触发解析失败。
    // 需要改版本/说明时直接改 mods.toml 即可。
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}