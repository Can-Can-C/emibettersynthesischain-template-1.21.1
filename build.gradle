plugins {
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 官方客户端用 Java 17
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: "${mappings_channel}", version: "${mappings_version}"

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // dev 运行时把 refmap 里 SRG 目标名映射回官方名（见 emibettersynthesischain.refmap.json，
            // 覆盖 BoMScreen.render/mouseClicked、ConfigScreen.init、AbstractContainerScreen.render 四个 vanilla 覆写点）
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { "${mod_id}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${mod_id}" { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
            mods { "${mod_id}" { source sourceSets.main } }
        }
    }
}

// Mixin：注册 config（所有目标都是 EMI 类，无需 refmap —— 见下）
mixin {
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    // 官方 EMI maven（repo.sleeping.town）本网络不可达 → EMI 用本地 jar（./libs）
    flatDir {
        dir 'libs'
    }
    // mixin annotation processor
    maven {
        url 'https://repo.spongepowered.org/maven'
    }
    // MixinExtras（ConfigScreenMixin 的 @Local）
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:${forge_version}"

    // MixinExtras（@Local 等 MixinExtras 语法；ConfigScreenMixin 的 onAddJumpButtons @Local 需要）
    // forge 壳是 jarjar 薄壳（真类在嵌套 jar），编译用 common 模块
    implementation fg.deobf("io.github.llamalad7:mixinextras-common:0.3.6")
    implementation fg.deobf("io.github.llamalad7:mixinextras-forge:0.3.6")

    // EMI（1.20.1 Forge 官方构建）：compileOnly 编进 classpath（含我们 Mixin 的内部类），
    // runtimeOnly 供 runClient 开发环境加载；不打进 mod 包、不发布。
    // fg.deobf：Forge 开发环境用 MCP 官方名，mod jar 是 SRG 名 → 必须经 FG 重映射器
    // （否则源里调 EMI 方法找不到符号、mixin AP 报 "Unable to locate obfuscation mapping"）。
    def emiJar = fg.deobf(files("libs/emi-1.1.24+1.20.1+forge.1.jar"))
    compileOnly emiJar
    runtimeOnly emiJar
}

// 不用 mixin 注解处理器（org.spongepowered.mixin:processor）：所有注入目标都是 EMI 类，
// 生产环境方法名不变 → 不需要 refmap；AP 反而会对无映射的 mod 类目标报
// "Unable to locate obfuscation mapping" 编译错误。运行时 Mixin 按普通类名注入即可。

processResources {
    // 1.20.1 mods.toml 用硬编码值（见 src/main/resources/META-INF/mods.toml）：
    // ForgeGradle 的 expand 会把 TOML 当 Groovy 模板解析，中文/全角字符易触发解析失败。
    // 需要改版本/说明时直接改 mods.toml 即可。
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Version'   : '1',
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // javac 17 把 @Deprecated(forRemoval) 当"错误"诊断（如 Forge 1.20.1 的
    // ModLoadingContext.get()/FMLJavaModLoadingContext.get() 仍是最标准用法）：
    // 关闭 removal/deprecation lint，恢复警告级/静默。
    options.compilerArgs.add '-Xlint:-removal'
    options.compilerArgs.add '-Xlint:-deprecation'
    // 所有 mixin 目标都是 EMI（mod 类，非 vanilla）→ 无 SRG 映射可查，
    // 关掉 refmap 生成/映射可避免 "Unable to locate obfuscation mapping" 编译错误
    // （运行时这些 mixin 目标是普通类名，不需要 refmap）。
    options.compilerArgs.add '-Amixin.env.disableRefMap=true'
}